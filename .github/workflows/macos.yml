name: macOS build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        static: [OFF, ON]
    name: macOS (static=${{ matrix.static }})

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          # CMakeLists.txt asks for CMake 4.1 or newer; minimodem pulls in PulseAudio
          brew install cmake pkgconf hamlib minimodem
          cmake --version

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHAMPROOF_STATIC=${{ matrix.static }}

      - name: Build
        run: cmake --build build -j

      - name: Check
        run: |
          otool -L build/HamProof
          # CAT against Hamlib's dummy rig (model 1), so no radio is needed
          build/cat_test x 1
          minimodem --benchmarks > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: HamProof-macos-static-${{ matrix.static }}
          path: |
            build/HamProof
            build/cat_test
